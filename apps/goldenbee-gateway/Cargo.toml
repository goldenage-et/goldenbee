[package]
name = "goldenbee-gateway"
description = "Goldenbee standalone Gateway HTTP adapter over gateway-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gb-gateway"
path = "src/main.rs"

[features]
default = []
postgres = ["gateway-core/postgres"]

[dependencies]
common = { path = "../../crates/common" }
futures.workspace = true
gateway-core = { path = "../../crates/gateway-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
uuid = { workspace = true }
reqwest.workspace = true
url = "2.5"
instance = { path = "../../crates/instance" }
install = { path = "../../crates/install" }
async-trait.workspace = true
flate2 = "1.0"
tar = "0.4"
tempfile = { workspace = true }
toml = "1.2"

[dev-dependencies]
sdk = { path = "../../crates/sdk" }
provider-crypto = { path = "../../crates/provider-crypto" }
base64.workspace = true
tempfile = { workspace = true }
load-harness = { path = "../../tests/load-harness" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
socket2 = "0.6"

[lints]
workspace = true
