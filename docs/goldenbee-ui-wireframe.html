<style>

ng:7px 10px;font-size:11px}.footerbar{height:29px;flex-shrink:0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:var(--dim);background:#0d131b;font-size:10px;gap:10px}.footerbar strong{color:var(--green)}.inspector{width:264px;flex-shrink:0;background:#111820;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.inspect-head{padding:15px 13px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.inspect-tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line)}.inspect-tab{flex:1;padding:8px 4px;background:transparent;border:0;color:var(--muted);font-size:11px;border-radius:6px}.inspect-tab.active{background:#293646;color:var(--text)}.inspect-body{overflow:auto;min-height:0;padding:12px}.tree{padding:0;margin:0;list-style:none}.tree li{padding:7px 4px;font-family:ui-monospace,monospace;font-size:11px;color:#aabbce;cursor:pointer}.tree li:hover{background:#22303e;border-radius:6px}.tree .indent{padding-left:18px}.tree .indent2{padding-left:36px}.tree .selected{background:#283b49;border-radius:6px;color:var(--gold)}.info{color:var(--muted);font-size:11px;line-height:1.7}.metric{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:11px}.metric span{color:var(--muted)}.progress{height:5px;background:#293646;border-radius:99px;overflow:hidden;margin-top:6px}.progress>i{display:block;height:100%;background:var(--gold)}.empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px;color:var(--muted)}.empty .symbol{font-size:40px;color:var(--gold)}.modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020507cc;z-index:20;padding:18px;backdrop-filter:blur(5px)}.modal-backdrop.show{display:flex}.modal{width:min(680px,100%);max-height:88dvh;overflow:auto;background:#171f2b;border:1px solid #3f4d5c;border-radius:16px;box-shadow:var(--shadow)}.modal-top{padding:19px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-top h2{margin:0;font-size:16px}.modal-content{padding:20px 22px}.settingnav{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.settingnav button{border:1px solid var(--line);background:#1d2935;border-radius:7px;padding:8px 11px;font-size:11px;color:var(--muted)}.settingnav button.active{background:var(--goldbg);color:var(--gold);border-color:#72582c}.field{margin-bottom:18px}.field label{display:block;color:#d8e0eb;font-weight:700;font-size:11px;margin-bottom:6px}.field p{color:var(--muted);font-size:11px;line-height:1.6;margin:5px 0}.field input,.field select,.field textarea{width:100%;background:#0f1721;border:1px solid #3b4858;border-radius:7px;padding:10px}.field textarea{min-height:90px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-bottom{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:44px;right:22px;background:#253344;border:1px solid #516276;padding:12px 16px;border-radius:10px;color:#e8eef5;box-shadow:var(--shadow);z-index:40;display:none}.toast.show{display:block}.kbar{display:none;position:fixed;inset:0;background:#000b;z-index:30;padding:13dvh 20px}.kbar.show{display:block}.kpanel{max-width:550px;margin:auto;border-radius:13px;background:#1a2430;border:1px solid #4d5d70;overflow:hidden;box-shadow:var(--shadow)}.kpanel input{background:#121b26;border:0;border-bottom:1px solid var(--line);padding:18px;width:100%;outline:none;font-size:14px}.kitem{padding:13px 18px;border-bottom:1px solid #2c3947;cursor:pointer}.kitem:hover{background:#2a3949}.muted{color:var(--muted)}.badge{border:1px solid #3e5061;color:#aab8c7;border-radius:5px;padding:3px 6px;font-size:10px}.hide{display:none!important}.mobile-toggle{display:none}@media(max-width:1100px) <body>
<div class="app">
  <nav class="rail" aria-label="Primary navigation">
    <div class="logo" title="Goldenbee">✦</div>
    <button class="railbtn active" title="Command Center" onclick="setRail(this);toast('Command Center')">▦</button>
    <button class="railbtn" title="Gateway overview" onclick="setRail(this);openOverview()">⬡</button>
    <button class="railbtn" title="Attention queue" onclick="setRail(this);showAttention()">◇<i class="dot"></i></button>
    <button class="railbtn" title="Activity" onclick="setRail(this);openActivity()">◷</button>
    <div class="railbottom"><button class="railbtn" title="Search / command palette (Ctrl+K)" onclick="commandPalette()">⌕</button><button class="railbtn" title="Client settings" onclick="openSettings('client')">⚙</button><button class="railbtn" title="Help" onclick="toast('Prototype shortcuts: Ctrl+K · Esc · Ctrl+Enter')">?</button></div>
  </nav>
  <aside class="side" id="side">
    <div class="sideheader"><span class="eyebrow">Gateways</span><button class="tinybtn" title="Add gateway" onclick="addGateway()">＋</button></div>
    <div id="gateways" class="gateway-list"></div>
    <div class="side-sep"></div>
    <div class="section-header"><span class="eyebrow">Workers</span><button class="tinybtn" onclick="newWorker()" title="Register worker">＋</button></div>
    <div class="side-scroll"><div id="workers"></div><div class="side-sep" style="margin-top:14px"></div><div class="section-header"><span class="eyebrow">Background sessions</span><span class="badge" id="bgCount">0</span></div><div id="backgroundList"></div></div>
    <div class="side-footer"><span class="status working"></span> Gateway connection <strong style="margin-left:auto;color:var(--green)">Secure</strong></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="tinybtn mobile-toggle" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="breadcrumbs"><span class="muted">Goldenbee</span><span class="slash">/</span><span class="crumb" id="gatewayTitle">Production Gateway</span><span class="slash">/</span><span class="crumb muted" id="tabTitle">Operations</span></div><div class="top-actions"><button class="pill" onclick="commandPalette()">⌕ Search <span class="muted">⌘ K</span></button><button class="outline" onclick="openSettings('gateway')" title="Gateway settings">⚙ Gateway</button><button class="goldbtn" onclick="newSession()">＋ New session</button></div></header>
    <div class="tabsbar" id="tabs"></div>
    <div class="subbar"><div class="subbar-title" id="groupTitle">Operations</div><span class="pill" id="sessionSummary">0 sessions</span><button class="tinybtn" title="Split selected session into another panel" onclick="splitSession()">◫ Split</button><button class="tinybtn" title="Show/hide file inspector" onclick="toggleInspector()">▤ Files</button><button class="tinybtn" title="Group menu" onclick="groupMenu()">···</button></div>
    <div class="workspace"><div class="canvas"><div class="panels" id="panels"></div></div><aside class="inspector" id="inspector"><div class="inspect-head"><span class="eyebrow">Focused session</span><button class="tinybtn" onclick="toggleInspector()">✕</button></div><div class="inspect-tabs"><button class="inspect-tab active" data-inspect="files" onclick="inspect('files')">Files</button><button class="inspect-tab" data-inspect="tasks" onclick="inspect('tasks')">Tasks</button><button class="inspect-tab" data-inspect="details" onclick="inspect('details')">Details</button></div><div class="inspect-body" id="inspectBody"></div></aside></div>
    <footer class="footerbar"><span id="footerLeft">● Connected · 3 workers online</span><span>Agent Gateway → Agent Worker <span class="slash">·</span> <strong>Sessions persist independently of client</strong></span><span>Goldenbee UI concept v1</span></footer>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h2 id="modalTitle">Settings</h2><button class="tinybtn" onclick="closeModal()">✕</button></div><div class="modal-content" id="modalContent"></div><div class="modal-bottom"><button class="outline" onclick="closeModal()">Cancel</button><button class="goldbtn" id="modalAction" onclick="saveModal()">Save changes</button></div></div></div>
<div class="kbar" id="kbar" onclick="if(event.target===this)closePalette()"><div class="kpanel"><input id="commandInput" placeholder="Type a command, worker, session or gateway…" oninput="renderCommands()"><div id="commandResults"></div></div></div>
<div class="toast" id="toast"></div>
<script>
// Goldenbee UI prototype. State is entirely local: replace command handlers with Gateway API calls.
const state={gateway:'production',tab:'operations',focus:'s1',inspect:'files',inspector:true,modal:null,settingsTab:'general',gateways:[{id:'production',name:'Production Gateway',host:'gateway.goldenbee.local',online:true},{id:'development',name:'Development Gateway',host:'localhost:8080',online:true},{id:'edge',name:'Edge / Research Node',host:'edge-worker-01',online:false}],workers:[{id:'w1',gateway:'production',name:'Coordinator',role:'Orchestrator',state:'working',initial:'CO'},{id:'w2',gateway:'production',name:'Developer',role:'Coding worker',state:'working',initial:'DV'},{id:'w3',gateway:'production',name:'Reviewer',role:'Quality assurance',state:'attention',initial:'RV'},{id:'w4',gateway:'production',name:'Researcher',role:'Research worker',state:'done',initial:'RS'},{id:'w5',gateway:'development',name:'Dev Worker',role:'Sandbox runtime',state:'working',initial:'DW'},{id:'w6',gateway:'edge',name:'Remote Worker',role:'Edge runtime',state:'offline',initial:'RW'}],groups:[{id:'operations',gateway:'production',name:'Operations',sessions:['s1','s2']},{id:'website',gateway:'production',name:'Website redesign',sessions:['s3','s4']},{id:'research',gateway:'production',name:'Research',sessions:['s5']},{id:'testing',gateway:'development',name:'Test sessions',sessions:['s6']},{id:'edgegroup',gateway:'edge',name:'Edge tasks',sessions:['s7']}],sessions:[{id:'s1',gateway:'production',group:'operations',worker:'w1',name:'Platform orchestration',state:'working',background:false,task:'Coordinate the delivery of the Goldenbee command center. Break down work and delegate tasks.',progress:72,logs:['[09:41] Plan initialized · 6 work items','[09:42] Delegated interface work to Developer','[09:44] Reviewer assigned acceptance criteria','[09:46] Monitoring 3 worker activities']},{id:'s2',gateway:'production',group:'operations',worker:'w3',name:'Architecture review',state:'attention',background:false,task:'Review gateway session persistence and API contracts.',progress:64,logs:['[09:32] Reviewed gateway lifecycle','[09:35] Compared three session ownership models','[09:39] Approval required: authorize proposed schema']},{id:'s3',gateway:'production',group:'website',worker:'w2',name:'Implement landing page',state:'working',background:false,task:'Implement responsive landing page from approved layout.',progress:44,logs:['[10:01] Exploring project components','[10:05] Created navigation shell','[10:07] Implementing responsive hero']},{id:'s4',gateway:'production',group:'website',worker:'w3',name:'Accessibility audit',state:'done',background:false,task:'Check page accessibility and report actionable issues.',progress:100,logs:['[09:12] Audited navigation','[09:18] Verified keyboard focus','[09:23] Report generated · 4 recommendations']},{id:'s5',gateway:'production',group:'research',worker:'w4',name:'Knowledge indexing',state:'done',background:true,task:'Index reference documents and link entities.',progress:100,logs:['[08:30] Loaded 48 documents','[08:33] Indexed 1,280 chunks','[08:38] Completed indexing']},{id:'s6',gateway:'development',group:'testing',worker:'w5',name:'Gateway integration tests',state:'working',background:false,task:'Validate session lifecycle through test harness.',progress:30,logs:['[10:07] Connected to sandbox','[10:08] Running integration tests']},{id:'s7',gateway:'edge',group:'edgegroup',worker:'w6',name:'Remote sync',state:'offline',background:false,task:'Reconcile cached remote jobs.',progress:14,logs:['[07:21] Remote node disconnected','[07:21] Session state persisted']}],next:8};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const g=()=>state.gateways.find(x=>x.id===state.gateway);const group=()=>state.groups.find(x=>x.id===state.tab);const session=id=>state.sessions.find(x=>x.id===id);const worker=id=>state.workers.find(x=>x.id===id);const label=s=>({working:'Working',attention:'Needs approval',done:'Completed',offline:'Offline',idle:'Idle'}[s]||s);
function render(){if(!group()||group().gateway!==state.gateway)state.tab=(state.groups.find(x=>x.gateway===state.gateway)||{}).id;const gr=group();$('#gatewayTitle').textContent=g()?.name||'Gateway';$('#tabTitle').textContent=gr?.name||'No group';$('#groupTitle').textContent=gr?.name||'No session group';$('#gateways').innerHTML=state.gateways.map(x=>`<button class="gateway ${state.gateway===x.id?'active':''}" onclick="switchGateway('${x.id}')"><span class="gw-icon">⬡</span><span class="gw-txt"><div class="gw-name">${esc(x.name)}</div><div class="gw-meta"><span class="status ${x.online?'working':'offline'}"></span>${x.online?'Connected':'Disconnected'}</div></span></button>`).join('');$('#workers').innerHTML=state.workers.filter(x=>x.gateway===state.gateway).map(x=>`<button class="worker" onclick="workerInfo('${x.id}')"><span class="avatar">${esc(x.initial)}</span><span class="details"><div class="primary">${esc(x.name)}</div><div class="secondary"><span class="status ${x.state}"></span>${esc(label(x.state))}</div></span><span class="muted">›</span></button>`).join('');const bg=state.sessions.filter(x=>x.gateway===state.gateway&&x.background);$('#bgCount').textContent=bg.length;$('#backgroundList').innerHTML=bg.length?bg.map(x=>`<button class="worker" onclick="restoreSession('${x.id}')"><span class="avatar">↗</span><span class="details"><div class="primary">${esc(x.name)}</div><div class="secondary">${esc(label(x.state))} · Restore</div></span></button>`).join(''):'<div class="info" style="padding:4px 15px">No background sessions</div>';$('#tabs').innerHTML=state.groups.filter(x=>x.gateway===state.gateway).map(x=>`<button class="tab ${x.id===state.tab?'active':''}" onclick="switchTab('${x.id}')"><span>▤</span><span>${esc(x.name)}</span><span class="badge">${x.sessions.filter(id=>!session(id)?.background).length}</span><span class="close" onclick="event.stopPropagation();closeTab('${x.id}')">×</span></button>`).join('')+'<button class="tabplus" title="New session group" onclick="newGroup()">+</button>';const active=gr?gr.sessions.map(session).filter(x=>x&&!x.background):[];$('#sessionSummary').textContent=active.length+' visible sessions';if(!active.some(x=>x.id===state.focus))state.focus=active[0]?.id||null;$('#panels').className='panels '+(active.length===1?'single':active.length===3?'triple':'');$('#panels').innerHTML=active.length?active.map(renderPanel).join(''):`<div class="empty"><div class="symbol">✦</div><h2 style="margin:0;color:var(--text)">Your session group is clear</h2><div>Start a worker session or restore one running in the background.</div><button class="goldbtn" onclick="newSession()">＋ Start agent session</button></div>`;renderInspector();$('#footerLeft').textContent='● '+(g()?.online?'Connected':'Gateway offline')+' · '+state.workers.filter(x=>x.gateway===state.gateway&&x.state!=='offline').length+' workers online';}
function renderPanel(s){const w=worker(s.worker);return `<section class="panel ${state.focus===s.id?'focused':''}" onclick="focusSession('${s.id}')"><div class="panel-head"><span class="panel-id">${esc(w?.initial||'AG')}</span><div><div class="panel-name">${esc(s.name)}</div><div class="panel-meta">${esc(w?.name||'Unknown worker')} · <span class="status ${s.state}"></span>${label(s.state)}</div></div><div class="panel-spacer"></div><button class="action" title="Worker settings" onclick="event.stopPropagation();openSettings('worker','${s.worker}')">⚙</button><button class="action" title="Move session to background" onclick="event.stopPropagation();backgroundSession('${s.id}')">↘</button><button class="action" title="Focus only this session" onclick="event.stopPropagation();soloSession('${s.id}')">⛶</button><button class="action" title="End session" onclick="event.stopPropagation();endSession('${s.id}')">×</button></div><div class="panel-body"><div class="messages"><div class="chat user"><div class="who">USER · OBJECTIVE</div><div class="bubble">${esc(s.task)}</div></div><div class="chat"><div class="who">${esc(w?.name||'AGENT')} · SESSION UPDATE</div><div class="bubble">${s.state==='attention'?'I need an approval to continue with the proposed changes.':s.state==='done'?'The task is complete. The final report and artifacts are ready for review.':s.state==='offline'?'Worker is disconnected. Session state remains stored at the gateway.':'Executing the current plan. Progress and tool results are streamed into this session.'}</div></div></div><div class="analysis-card"><h4>Execution plan <span class="muted" style="float:right">${s.progress}%</span></h4><div class="progress"><i style="width:${s.progress}%"></i></div><div class="checkitem"><span class="checkmark">✓</span> Analyze requirements and establish scope</div><div class="checkitem"><span class="checkmark">✓</span> Delegate or execute planned work</div><div class="checkitem"><span>${s.state==='done'?'✓':'○'}</span> Validate results and produce report</div></div>${s.state==='attention'?`<div class="attention-box">◆ Approval required: Accept proposed session persistence schema?<div style="margin-top:10px;display:flex;gap:8px"><button class="smallbtn" onclick="event.stopPropagation();approve('${s.id}')">✓ Approve</button><button class="smallbtn" onclick="event.stopPropagation();toast('Decision deferred; session still awaiting approval')">Review later</button></div></div>`:''}<div class="console">${s.logs.map(x=>esc(x)).join('\n')}</div></div><div class="input-area"><span class="muted">⌁</span><input id="msg-${s.id}" onkeydown="if(event.key==='Enter'){event.stopPropagation();sendMessage('${s.id}')}" placeholder="Follow up with ${esc(w?.name||'agent')}…"><button class="send" onclick="event.stopPropagation();sendMessage('${s.id}')">Send ↗</button></div></section>`}
function renderInspector(){const s=session(state.focus);$('#inspector').classList.toggle('hide',!state.inspector);document.querySelectorAll('.inspect-tab').forEach(el=>el.classList.toggle('active',el.dataset.inspect===state.inspect));if(!s){$('#inspectBody').innerHTML='<p class="info">Select an agent session to view its files and details.</p>';return}if(state.inspect==='files')$('#inspectBody').innerHTML=`<div class="eyebrow" style="margin-bottom:12px">Session workspace</div><ul class="tree"><li onclick="toast('Workspace root selected')">⌄ 📁 goldenbee/</li><li class="indent" onclick="toast('src selected')">⌄ 📁 src/</li><li class="indent2" onclick="toast('agents selected')">▸ 📁 agents/</li><li class="indent2" onclick="toast('gateway.rs selected')">♧ gateway.rs</li><li class="indent2 selected" onclick="toast('session.rs selected')">♧ session.rs</li><li class="indent" onclick="toast('tests selected')">▸ 📁 tests/</li><li class="indent" onclick="toast('README selected')">▤ README.md</li><li class="indent" onclick="toast('plan selected')">▤ plan.md</li></ul><div class="side-sep" style="margin:20px 0"></div><div class="eyebrow">Recent artifacts</div><p class="info">▤ implementation-plan.md<br>▤ acceptance-report.md<br>▤ session-events.json</p><p class="info">Files are illustrative; connect this panel to worker workspace APIs.</p>`;else if(state.inspect==='tasks')$('#inspectBody').innerHTML=`<div class="eyebrow">Execution checklist</div><div class="checkitem"><span class="checkmark">✓</span> Scope and plan</div><div class="checkitem"><span class="checkmark">✓</span> Assign worker</div><div class="checkitem"><span>○</span> Implement work</div><div class="checkitem"><span>○</span> Validate and finalize</div><div class="side-sep" style="margin:18px 0"></div><div class="metric"><span>Completion</span><b>${s.progress}%</b></div><div class="progress"><i style="width:${s.progress}%"></i></div>`;else $('#inspectBody').innerHTML=`<div class="eyebrow">Runtime information</div><div class="metric"><span>Session ID</span><b>${esc(s.id)}</b></div><div class="metric"><span>Worker</span><b>${esc(worker(s.worker)?.name)}</b></div><div class="metric"><span>Status</span><b>${label(s.state)}</b></div><div class="metric"><span>Execution</span><b>Gateway managed</b></div><div class="metric"><span>Persistence</span><b>Enabled</b></div><div class="metric"><span>In background</span><b>${s.background?'Yes':'No'}</b></div><div class="side-sep" style="margin:18px 0"></div><button class="outline" onclick="openSettings('worker','${s.worker}')">⚙ Configure worker</button>`}
function switchGateway(id){state.gateway=id;state.tab=state.groups.find(x=>x.gateway===id)?.id;state.focus=null;document.getElementById('side').classList.remove('open');render()}function switchTab(id){state.tab=id;state.focus=null;render()}function focusSession(id){if(state.focus!==id){state.focus=id;render()}}function inspect(mode){state.inspect=mode;renderInspector()}function toggleInspector(){state.inspector=!state.inspector;renderInspector()}function newGroup(){const name=prompt('Session group name','New session group');if(!name?.trim())return;const id='group'+Date.now();state.groups.push({id,gateway:state.gateway,name:name.trim(),sessions:[]});state.tab=id;render()}function closeTab(id){const gr=state.groups.find(x=>x.id===id);if(!gr)return;if(gr.sessions.some(sid=>!session(sid)?.background)&&!confirm('Close group? Visible sessions will be moved to the background, not terminated.'))return;gr.sessions.forEach(sid=>{if(session(sid))session(sid).background=true});state.groups=state.groups.filter(x=>x.id!==id);if(!state.groups.some(x=>x.gateway===state.gateway))state.groups.push({id:'group'+Date.now(),gateway:state.gateway,name:'New group',sessions:[]});state.tab=state.groups.find(x=>x.gateway===state.gateway).id;render()}function newSession(){const gr=group();if(!gr){newGroup();return}const id='s'+state.next++;const choices=state.workers.filter(x=>x.gateway===state.gateway&&x.state!=='offline');if(!choices.length){toast('Register an online worker first');return}const w=choices[0];state.sessions.push({id,gateway:state.gateway,group:gr.id,worker:w.id,name:'New agent session',state:'working',background:false,task:'New task — use the follow-up input to give instructions.',progress:0,logs:['[now] Session created','[now] Waiting for task instructions']});gr.sessions.push(id);state.focus=id;render();toast('New session created (demo)')}function backgroundSession(id){session(id).background=true;render();toast('Session moved to background · execution continues')}function restoreSession(id){const s=session(id);s.background=false;let gr=state.groups.find(x=>x.id===s.group);if(!gr){gr=group();s.group=gr.id;gr.sessions.push(id)}state.tab=gr.id;state.focus=id;render();toast('Session restored')}function endSession(id){if(!confirm('End this session? This differs from moving it to the background.'))return;state.sessions=state.sessions.filter(s=>s.id!==id);state.groups.forEach(gr=>gr.sessions=gr.sessions.filter(x=>x!==id));render();toast('Session ended')}function soloSession(id){const gr=group();gr.sessions.forEach(x=>{if(x!==id&&session(x))session(x).background=true});state.focus=id;render();toast('Other sessions kept running in background')}function splitSession(){newSession();toast('Additional agent panel created')}function approve(id){const s=session(id);s.state='working';s.logs.push('[now] Approval received · resuming task');const w=worker(s.worker);if(w)w.state='working';render();toast('Approval recorded (demo)')}function sendMessage(id){const input=$('#msg-'+id);const value=input?.value.trim();if(!value)return;const s=session(id);s.logs.push('[user] '+value);if(s.task.startsWith('New task'))s.task=value;s.state='working';render();toast('Follow-up added to local session mock')}function workerInfo(id){const w=worker(id);openSettings('worker',id)}function addGateway(){const name=prompt('Gateway name','New gateway');if(!name?.trim())return;const id='gateway'+Date.now();state.gateways.push({id,name:name.trim(),host:'not-configured',online:false});state.groups.push({id:'group'+Date.now(),gateway:id,name:'Operations',sessions:[]});switchGateway(id);toast('Gateway placeholder added · configure connection')}function newWorker(){openSettings('worker',null,true)}function groupMenu(){const name=prompt('Rename session group',group()?.name);if(name?.trim()){group().name=name.trim();render()}}function setRail(el){document.querySelectorAll('.railbtn').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function showAttention(){const s=state.sessions.find(x=>x.state==='attention');if(s){switchGateway(s.gateway);switchTab(s.group);state.focus=s.id;render();toast('Focused a session requiring attention')}else toast('No sessions require attention')}function openOverview(){const active=state.sessions.filter(x=>x.gateway===state.gateway);const online=state.workers.filter(x=>x.gateway===state.gateway&&x.state!=='offline').length;showModal('Gateway overview',`<div class="eyebrow">${esc(g()?.name||'Gateway')}</div><h2 style="font-size:24px;margin:12px 0">${active.length} sessions · ${online} workers online</h2><p class="info">Independent gateway process holds session state, worker registrations, execution routing, and events even when this client disconnects.</p><div class="metric"><span>Connected endpoint</span><b>${esc(g()?.host)}</b></div><div class="metric"><span>Session groups</span><b>${state.groups.filter(x=>x.gateway===state.gateway).length}</b></div><div class="metric"><span>Background sessions</span><b>${active.filter(x=>x.background).length}</b></div>`,null,'Close')}function openActivity(){showModal('Recent activity',`<div class="console">${state.sessions.filter(x=>x.gateway===state.gateway).flatMap(s=>s.logs.slice(-2).map(l=>esc(s.name)+' · '+esc(l))).join('\n')}</div>`,null,'Close')}
function showModal(title,content,kind,action){state.modal=kind;$('#modalTitle').textContent=title;$('#modalContent').innerHTML=content;$('#modalAction').textContent=action||'Save changes';$('#modalBackdrop').classList.add('show')}function closeModal(){$('#modalBackdrop').classList.remove('show');state.modal=null}function openSettings(kind,workerId=null,creating=false){state.settingsTab='general';state.settingWorker=workerId;state.creatingWorker=creating;state.modal=kind;drawSettings(kind)}function drawSettings(kind){const tabs=kind==='client'?['general','appearance','shortcuts','notifications']:kind==='gateway'?['general','connection','security','persistence']:['general','runtime','permissions','limits'];let content=`<div class="settingnav">${tabs.map(t=>`<button class="${state.settingsTab===t?'active':''}" onclick="state.settingsTab='${t}';drawSettings('${kind}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;const w=worker(state.settingWorker);if(kind==='client'){if(state.settingsTab==='general')content+=field('Client display name','Goldenbee Command Center','Local UI identity')+field('Default gateway',g()?.name,'The gateway selected when opening the app');if(state.settingsTab==='appearance')content+=selectField('Theme',['Midnight (current)','Graphite','Light'])+selectField('Interface density',['Comfortable','Compact'])+selectField('Panel layout',['Auto','Single column','Two columns']);if(state.settingsTab==='shortcuts')content+='<div class="info">Ctrl/⌘ + K — Command palette<br>Esc — Close overlay<br>Enter — Send session message<br>Ctrl/⌘ + Enter — New session</div>';if(state.settingsTab==='notifications')content+=selectField('Session alerts',['All attention events','Only approvals','Muted'])+selectField('Background notifications',['Enabled','Disabled'])}else if(kind==='gateway'){if(state.settingsTab==='general')content+=field('Gateway name',g()?.name)+field('Gateway identifier',g()?.id);if(state.settingsTab==='connection')content+=field('Gateway endpoint',g()?.host)+selectField('Transport',['Secure WebSocket + REST','WebSocket','REST + SSE'])+'<p class="info">Gateway API calls are not connected in this concept.</p>';if(state.settingsTab==='security')content+=selectField('Authentication',['Session-based','API key','OAuth / OIDC'])+selectField('Transport security',['TLS required','Local only']);if(state.settingsTab==='persistence')content+=selectField('Session survival',['Continue after UI disconnect','Stop when UI closes'])+field('Retention days','30')+'<p class="info">Production rule: detaching a panel must never terminate its executing worker session.</p>'}else{if(state.settingsTab==='general')content+=field('Worker display name',w?.name||'New Worker')+field('Worker role',w?.role||'General agent')+field('Worker ID',w?.id||'Auto-generated');if(state.settingsTab==='runtime')content+=selectField('Runtime',['ADK-Rust worker','Remote worker','Local worker'])+field('Execution endpoint','gateway-managed')+field('Worker definition','workers/coordinator.yaml');if(state.settingsTab==='permissions')content+=selectField('Filesystem access',['Workspace scoped','Read only','Disabled'])+selectField('Tool approvals',['Ask for sensitive actions','Auto approve safe actions','Require all approvals']);if(state.settingsTab==='limits')content+=field('Maximum concurrent sessions','4')+field('Default timeout (minutes)','120')+selectField('Execution mode',['Foreground or background','Foreground only'])}showModal((kind==='client'?'Client':kind==='gateway'?'Gateway':'Worker')+' settings',content,kind,state.creatingWorker?'Register worker':'Save changes')}
function field(label,value,help=''){return `<div class="field"><label>${esc(label)}</label><input value="${esc(value??'')}" aria-label="${esc(label)}">${help?`<p>${esc(help)}</p>`:''}</div>`}function selectField(label,opts){return `<div class="field"><label>${esc(label)}</label><select>${opts.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`}function saveModal(){if(state.modal==='worker'&&state.creatingWorker){const name=$('#modalContent input')?.value.trim()||'New Worker';const id='w'+Date.now();state.workers.push({id,gateway:state.gateway,name,role:'General agent',state:'idle',initial:name.slice(0,2).toUpperCase()});toast('Worker registered locally (demo)')}else if(state.modal)toast('Settings preview saved locally (demo; no backend)');closeModal();render()}
const cmds=[{name:'New agent session',action:newSession},{name:'New session group',action:newGroup},{name:'Register worker',action:newWorker},{name:'Add gateway',action:addGateway},{name:'Client settings',action:()=>openSettings('client')},{name:'Gateway settings',action:()=>openSettings('gateway')},{name:'Show attention queue',action:showAttention},{name:'Toggle file explorer',action:toggleInspector}];function commandPalette(){$('#kbar').classList.add('show');$('#commandInput').value='';renderCommands();$('#commandInput').focus()}function closePalette(){$('#kbar').classList.remove('show')}function renderCommands(){const q=$('#commandInput').value.toLowerCase();const entries=[...cmds,...state.groups.filter(x=>x.gateway===state.gateway).map(x=>({name:'Open tab: '+x.name,action:()=>switchTab(x.id)})),...state.sessions.filter(x=>x.gateway===state.gateway).map(x=>({name:'Open session: '+x.name,action:()=>{if(x.background)restoreSession(x.id);else{state.tab=x.group;state.focus=x.id;render()}}}))].filter(x=>x.name.toLowerCase().includes(q));$('#commandResults').innerHTML=entries.length?entries.map((x,i)=>`<div class="kitem" onclick="runCommand(${i})">⌁ &nbsp; ${esc(x.name)}</div>`).join(''):'<div class="kitem muted">No matching commands</div>';window.commandMatches=entries}function runCommand(i){closePalette();window.commandMatches[i]?.action()}function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>el.classList.remove('show'),2800)}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePalette()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();newSession()}if(e.key==='Enter'&&$('#kbar').classList.contains('show'))runCommand(0)});render();
</script>
