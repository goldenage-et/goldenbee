name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: "16777216"
  RUST_TEST_THREADS: "1"
  # The hosted runner's WebDriver dependency creates a current-thread runtime
  # that overflows its default stack. The real-browser suite is exercised on
  # developer hosts; non-driver browser policy tests still run here.
  GOLDENBEE_SKIP_BROWSER_TESTS: "1"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Check workspace and backlog
        run: make check
