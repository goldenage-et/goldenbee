[workspace]
members = [
    "apps/*",
    "crates/*",
    "examples/sdk-client",
    "tests/load-harness",
    "workers/coding",
    "workers/echo",
    "workers/general",
    "workers/graph",
    "workers/knowledge",
]
# The web Client is an npm/TypeScript application, not a Rust workspace member.
exclude = ["apps/goldenbee-web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.13"
notify = "8.2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
