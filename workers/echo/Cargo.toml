[package]
name = "echo"
description = "Independent Echo Worker Package with one native text capability"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "echo"
path = "src/main.rs"

[dependencies]
common = { path = "../../crates/common" }
runtime = { path = "../../crates/runtime", features = ["launcher-cli"] }
adk-rust = { version = "=2.3.0", default-features = false, features = ["agents", "runner", "sessions", "server", "plugin"] }
async-trait.workspace = true
dotenvy = "0.15"
serde_json.workspace = true
tokio = { workspace = true }

[dev-dependencies]
base64.workspace = true
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
install = { path = "../../crates/install" }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
