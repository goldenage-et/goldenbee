[package]
name = "graph"
description = "Native ADK graph workflow Worker Package"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
common = { path = "../../crates/common" }
runtime = { path = "../../crates/runtime", features = ["graph", "launcher-cli"] }
adk-rust = { version = "=2.3.0", default-features = false, features = ["agents", "graph"] }
tokio = { workspace = true }
serde_json.workspace = true
async-trait.workspace = true
dotenvy = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

[lints]
workspace = true
