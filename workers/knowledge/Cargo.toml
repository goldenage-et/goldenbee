[package]
name = "knowledge"
description = "Knowledge Worker Package: authorized document ingestion and cited native RAG retrieval"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "knowledge"
path = "src/main.rs"

[dependencies]
common = { path = "../../crates/common" }
runtime = { path = "../../crates/runtime", features = ["launcher-cli"] }
adk-rust = { version = "=2.3.0", default-features = false, features = ["agents", "runner", "sessions", "server", "plugin", "rag"] }
async-trait.workspace = true
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
dotenvy = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
install = { path = "../../crates/install" }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64.workspace = true

[lints]
workspace = true
